<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">역할 분리 — 결정론적 집계는 코드가, 서술은 모델이</title>
  <desc id="pipeDesc">일정 엑셀을 schedule_reader가 정규화하고 집계한다. 지표와 완료·진행·지연·이월 섹션은 코드가 생성하고, 요약 문장만 모델이 쓴다. 저장 직전 검증 게이트가 요약의 숫자를 집계값과 대조해 일치하지 않으면 저장을 거부한다.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
  </style>

  <rect width="1200" height="560" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#E3E0DA"/>

  <text class="sans" x="80" y="72" font-size="40" font-weight="700" fill="#111111">숫자는 코드가, 문장은 모델이</text>
  <text class="mono" x="80" y="106" font-size="20" fill="#6E6E6E">수치 계산을 모델에 맡기면 주간보고에 틀린 숫자가 들어간다</text>

  <!-- 1. 입력 -->
  <rect x="80" y="150" width="210" height="200" rx="8" fill="#FFFFFF" stroke="#C9C5BE"/>
  <text class="mono" x="100" y="182" font-size="18" fill="#6E6E6E">INPUT</text>
  <text class="sans" x="100" y="214" font-size="22" font-weight="600" fill="#111111">일정 엑셀</text>
  <text class="sans" x="100" y="244" font-size="20" fill="#3A3A3A">시트 = 주차</text>
  <text class="mono" x="100" y="274" font-size="20" fill="#111111">W31 W32 W33</text>
  <text class="sans" x="100" y="310" font-size="20" fill="#3A3A3A">업무 33건</text>

  <path d="M300 250 H332 M326 244 L332 250 L326 256" fill="none" stroke="#6E6E6E" stroke-width="2"/>

  <!-- 2. 리더 -->
  <rect x="340" y="150" width="210" height="200" rx="8" fill="#FFFFFF" stroke="#111111"/>
  <text class="mono" x="360" y="182" font-size="18" fill="#6E6E6E">CODE · 결정론적</text>
  <text class="mono" x="360" y="214" font-size="21" font-weight="700" fill="#111111">schedule_reader</text>
  <text class="sans" x="360" y="248" font-size="20" fill="#3A3A3A">상태 정규화</text>
  <text class="sans" x="360" y="278" font-size="20" fill="#3A3A3A">지연 · 이월 판정</text>
  <text class="sans" x="360" y="308" font-size="20" fill="#3A3A3A">집계</text>

  <path d="M560 250 H592 M586 244 L592 250 L586 256" fill="none" stroke="#6E6E6E" stroke-width="2"/>

  <!-- 3. 분기: 코드 / 모델 -->
  <rect x="600" y="150" width="210" height="92" rx="8" fill="#111111"/>
  <text class="mono" x="620" y="180" font-size="18" fill="#C9C5BE">CODE</text>
  <text class="sans" x="620" y="208" font-size="21" font-weight="600" fill="#FAF9F7">지표 · 완료 · 진행</text>
  <text class="sans" x="620" y="232" font-size="21" font-weight="600" fill="#FAF9F7">지연 · 차주 이월</text>

  <rect x="600" y="258" width="210" height="92" rx="8" fill="#FFFFFF" stroke="#111111" stroke-dasharray="6 4"/>
  <text class="mono" x="620" y="288" font-size="18" fill="#6E6E6E">MODEL</text>
  <text class="sans" x="620" y="316" font-size="21" font-weight="600" fill="#111111">요약 3~4문장</text>
  <text class="sans" x="620" y="340" font-size="20" fill="#3A3A3A">서술만 담당</text>

  <path d="M820 196 H852 M846 190 L852 196 L846 202" fill="none" stroke="#6E6E6E" stroke-width="2"/>
  <path d="M820 304 H852 M846 298 L852 304 L846 310" fill="none" stroke="#6E6E6E" stroke-width="2"/>

  <!-- 4. 산출물 -->
  <rect x="860" y="150" width="260" height="200" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text class="mono" x="880" y="182" font-size="18" fill="#6E6E6E">OUTPUT</text>
  <text class="mono" x="880" y="216" font-size="22" font-weight="700" fill="#111111">2026-W31.md</text>
  <line x1="880" y1="236" x2="1100" y2="236" stroke="#E3E0DA"/>
  <text class="sans" x="880" y="266" font-size="20" fill="#3A3A3A">git에 쌓으면 그 자체가</text>
  <text class="sans" x="880" y="292" font-size="20" fill="#3A3A3A">주차 간 이력이 된다</text>
  <text class="mono" x="880" y="326" font-size="18" fill="#6E6E6E">생성 시각 없음 → diff 안정</text>

  <line x1="80" y1="392" x2="1120" y2="392" stroke="#E3E0DA"/>

  <!-- 검증 게이트 -->
  <text class="mono" x="80" y="428" font-size="18" letter-spacing="2" fill="#6E6E6E">GUARD · 저장 직전</text>
  <text class="sans" x="80" y="462" font-size="24" font-weight="600" fill="#111111">요약의 숫자를 집계값과 대조한다. 없는 숫자가 있으면 저장을 거부한다.</text>

  <g>
    <rect x="80" y="486" width="500" height="46" rx="6" fill="#FFFFFF" stroke="#C9C5BE"/>
    <text class="mono" x="100" y="515" font-size="20" fill="#6E6E6E">"마감 20건 중 19건 완료(95.0%)"</text>
    <text class="sans" x="560" y="515" font-size="20" font-weight="700" text-anchor="end" fill="#111111">거부</text>

    <rect x="600" y="486" width="520" height="46" rx="6" fill="#111111"/>
    <text class="mono" x="620" y="515" font-size="20" fill="#C9C5BE">"마감 6건 중 5건 완료(83.3%)"</text>
    <text class="sans" x="1100" y="515" font-size="20" font-weight="700" text-anchor="end" fill="#FAF9F7">통과</text>
  </g>
</svg>
