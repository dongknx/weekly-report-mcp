<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">weekly-report-mcp — 주차별 일정 엑셀에서 주간보고서를 만드는 MCP 서버</title>
  <desc id="heroDesc">숫자는 코드가 만들고 문장은 모델이 쓴다. 주차 시트 W31, W32, W33을 집계해 Markdown 보고서를 생성한다. MCP 툴 7개, 검증 55개 항목 통과.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
  </style>

  <rect width="1200" height="380" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#E3E0DA"/>

  <!-- 좌측 상단 식별 라벨 -->
  <text class="mono" x="80" y="82" font-size="20" letter-spacing="2.5" fill="#6E6E6E">MCP SERVER · PYTHON · STDIO</text>

  <!-- 제목 -->
  <text class="sans" x="80" y="178" font-size="72" font-weight="700" fill="#111111">weekly-report-mcp</text>

  <!-- 가치 문장 -->
  <text class="sans" x="80" y="228" font-size="28" fill="#3A3A3A">주차별 일정 엑셀에서 주간업무보고서를 만드는 개인용 MCP 서버.</text>
  <text class="sans" x="80" y="268" font-size="28" fill="#111111" font-weight="600">숫자는 코드가 만들고, 문장은 모델이 쓴다.</text>

  <line x1="0" y1="300" x2="1200" y2="300" stroke="#E3E0DA"/>

  <!-- 모티프: 주차 시트 → 집계 → 보고서 -->
  <g>
    <rect x="80" y="320" width="76" height="40" rx="6" fill="#FFFFFF" stroke="#C9C5BE"/>
    <text class="mono" x="118" y="346" font-size="20" text-anchor="middle" fill="#111111">W31</text>

    <rect x="164" y="320" width="76" height="40" rx="6" fill="#FFFFFF" stroke="#C9C5BE"/>
    <text class="mono" x="202" y="346" font-size="20" text-anchor="middle" fill="#111111">W32</text>

    <rect x="248" y="320" width="76" height="40" rx="6" fill="#FFFFFF" stroke="#C9C5BE"/>
    <text class="mono" x="286" y="346" font-size="20" text-anchor="middle" fill="#111111">W33</text>

    <path d="M340 340 H368 M362 334 L368 340 L362 346" fill="none" stroke="#6E6E6E" stroke-width="2"/>

    <rect x="380" y="320" width="96" height="40" rx="6" fill="#111111"/>
    <text class="sans" x="428" y="347" font-size="21" text-anchor="middle" fill="#FAF9F7">집계</text>

    <path d="M492 340 H520 M514 334 L520 340 L514 346" fill="none" stroke="#6E6E6E" stroke-width="2"/>

    <rect x="532" y="320" width="212" height="40" rx="6" fill="#FFFFFF" stroke="#111111"/>
    <text class="mono" x="638" y="346" font-size="20" text-anchor="middle" fill="#111111">2026-W31.md</text>
  </g>

  <text class="mono" x="1120" y="346" font-size="20" text-anchor="end" fill="#6E6E6E">7 TOOLS · 55 CHECKS</text>
</svg>
